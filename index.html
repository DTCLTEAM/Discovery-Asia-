<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discovery Asia OS</title>
<style>
:root{
  --deep:#0E2A33; --deep2:#123A46; --paper:#F6F4EF; --card:#FFFFFF;
  --ink:#16262B; --muted:#5E6E73; --line:#E2DED4;
  --brass:#C99A3C; --brassBg:#FBF3E2;
  --act:#1E6E64; --actBg:#E4F0EE;
  --ok:#1E7A46; --okBg:#E3F2E9;
  --warn:#A96A12; --warnBg:#FBEED6;
  --bad:#B84A3A; --badBg:#F9E6E2;
  --blue:#2A5B8C; --blueBg:#E6EEF6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%;min-height:44px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--act);outline-offset:1px}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:10px 0 4px}
a{color:var(--act)}
/* Top bar */
#topbar{position:sticky;top:0;z-index:30;background:var(--deep);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px}
#topbar .brand{font-weight:800;letter-spacing:.14em;font-size:14px}
#topbar .brand small{display:block;font-weight:500;letter-spacing:.24em;font-size:9px;color:var(--brass)}
#topbar .sp{flex:1}
#topbar .who{font-size:12px;color:#BFD3D8;text-align:right;line-height:1.3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:9px;padding:10px 14px;font-size:14px;font-weight:700;background:var(--act);color:#fff;min-height:42px}
.btn.sm{padding:6px 10px;min-height:32px;font-size:12.5px;border-radius:7px}
.btn.ghost{background:#fff;color:var(--act);border:1px solid var(--act)}
.btn.gold{background:var(--brass);color:#231a05}
.btn.grey{background:#EDEAE1;color:var(--ink)}
.btn.red{background:var(--bad)}
.btn.deep{background:var(--deep2)}
.btn:disabled{opacity:.5;cursor:default}
/* Layout */
#shell{display:flex;min-height:calc(100vh - 56px)}
#nav{width:212px;flex:0 0 212px;background:#FCFBF7;border-right:1px solid var(--line);padding:12px 8px 90px}
#nav .grp{font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--muted);margin:14px 8px 4px}
#nav a{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;margin:1px 0}
#nav a .mno{font-size:10px;font-weight:800;color:var(--brass);width:20px}
#nav a.on{background:var(--deep);color:#fff}
#nav a.on .mno{color:var(--brass)}
#main{flex:1;min-width:0;padding:16px 16px 110px;max-width:1180px}
h1{font-size:21px;margin:2px 0 2px}
h2{font-size:16px;margin:0 0 8px}
.sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:0 1px 2px rgba(20,40,45,.04)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--act);border-radius:12px;padding:10px 12px}
.kpi .v{font-size:22px;font-weight:800}
.kpi .l{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi.gold{border-left-color:var(--brass)} .kpi.bad{border-left-color:var(--bad)} .kpi.blue{border-left-color:var(--blue)} .kpi.warn{border-left-color:var(--warn)}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13.5px;background:#fff}
th{background:#F2EFE7;text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:9px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid #EEEBE2;vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.03em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.b-grey{background:#EDEAE1;color:#4C5A5F}.b-act{background:var(--actBg);color:var(--act)}.b-ok{background:var(--okBg);color:var(--ok)}.b-warn{background:var(--warnBg);color:var(--warn)}.b-bad{background:var(--badBg);color:var(--bad)}.b-blue{background:var(--blueBg);color:var(--blue)}.b-gold{background:var(--brassBg);color:#8a6410}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--deep);border-color:var(--deep);color:#fff}
.alert{border-radius:10px;padding:9px 12px;font-size:13.5px;margin:6px 0;display:flex;gap:8px;align-items:flex-start}
.a-bad{background:var(--badBg);color:#7c3021}.a-warn{background:var(--warnBg);color:#7a4c0a}.a-ok{background:var(--okBg);color:#155a34}.a-blue{background:var(--blueBg);color:#1f4569}
.mini{font-size:12px;color:var(--muted)}
.hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.right{text-align:right}
.money{font-variant-numeric:tabular-nums}
.linkish{background:none;border:0;color:var(--act);font-weight:700;text-decoration:underline;padding:0;font-size:inherit}
/* modal */
#mwrap{position:fixed;inset:0;background:rgba(14,42,51,.55);z-index:50;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:18px 10px}
#mwrap.open{display:flex}
#modal{background:#fff;border-radius:16px;max-width:760px;width:100%;margin:auto 0}
#modal .mh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
#modal .mh h2{flex:1}
#modal .mb{padding:6px 16px 16px;max-height:72vh;overflow:auto}
#modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--deep) 0%, #143d4a 60%, #0c222a 100%);padding:20px}
#login .box{background:#fff;border-radius:18px;padding:26px 24px;max-width:400px;width:100%}
#login .mark{text-align:center;margin-bottom:14px}
#login .mark .t1{font-weight:800;letter-spacing:.2em;font-size:18px;color:var(--deep)}
#login .mark .t2{font-size:10px;letter-spacing:.32em;color:var(--brass);font-weight:700}
/* bottom nav (mobile) */
#bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--deep);padding:6px 4px calc(6px + env(safe-area-inset-bottom));grid-template-columns:repeat(6,1fr)}
#bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:#9FB6BC;text-decoration:none;font-size:10.5px;font-weight:700;padding:6px 2px;border-radius:8px;min-height:50px;justify-content:center}
#bnav a.on{color:var(--brass)}
#bnav .ico{font-size:17px}
@media(max-width:860px){
  #nav{display:none}
  #bnav{display:grid}
  #main{padding:12px 12px 130px}
  .grid2,.grid3{grid-template-columns:1fr}
}
@media print{ body{background:#fff} #topbar,#nav,#bnav,.noprint{display:none!important} #main{padding:0;max-width:none} .card{border:0;box-shadow:none} }
</style>
</head>
<body>
<div id="app"></div>
<div id="mwrap"><div id="modal"><div class="mh"><h2 id="mtitle"></h2><button class="btn sm grey" onclick="A.closeModal()">✕</button></div><div class="mb" id="mbody"></div><div class="mf" id="mfoot"></div></div></div>
<script>
"use strict";
/* ============================================================
   DISCOVERY ASIA OS — Phase 1 MVP (GitHub Pages build)
   Single file · no server · data in this device's localStorage
   ============================================================ */
var DBKEY="daos1", SESKEY="daos-session";
var db=null, session=null;

function blankDB(){return {
  v:1,
  settings:{
    company:"Discovery Asia Co., Ltd.", addr:"Bangkok, Thailand",
    phone:"+66 90 401 7468", whatsapp:"+66 85 929 0648", email:"info@discoveryasia.co.th", web:"discoveryasia.co.th",
    cur:"USD", minMargin:12, tax:0, payFee:0, prefix:"DA", defCity:"BKK",
    pwd:{admin:"DA-Admin-2026",md:"DA-MD-2026",sales:"DA-Sales-2026",resv:"DA-Resv-2026",ops:"DA-Ops-2026",acct:"DA-Acct-2026"}
  },
  agents:[], inquiries:[], suppliers:[], contracts:[], quotes:[], bookings:[],
  receipts:[], payments:[], audit:[], counters:{}, seq:0
};}
function load(){ try{var j=JSON.parse(localStorage.getItem(DBKEY)); if(j&&j.settings){ if(!j.counters)j.counters={}; if(!j.seq)j.seq=0; return j; } }catch(e){} return blankDB(); }
function save(){ try{ localStorage.setItem(DBKEY,JSON.stringify(db)); }catch(e){ alert("Could not save — device storage may be full. Export a backup from Settings."); } }
function uid(){ db.seq=(db.seq||0)+1; return Date.now().toString(36)+"-"+db.seq.toString(36)+Math.random().toString(36).slice(2,5); }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function n2(x){ x=parseFloat(x); return isFinite(x)?x:0; }
function money(x){ var v=n2(x); return db.settings.cur+" "+v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function money0(x){ var v=n2(x); return db.settings.cur+" "+v.toLocaleString("en-US",{maximumFractionDigits:0}); }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fdate(iso){ if(!iso)return "—"; var p=iso.split("-"); if(p.length<3)return esc(iso); var M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; return p[2]+" "+M[(+p[1]||1)-1]+" "+p[0]; }
function daysDiff(a,b){ try{ return Math.round((new Date(b)-new Date(a))/86400000); }catch(e){ return 0; } }
function byId(list,id){ for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i]; return null; }
function pushAudit(action,ref){ db.audit.unshift({at:new Date().toISOString(),by:session?session.name:"?",role:session?session.role:"?",action:action,ref:ref||""}); if(db.audit.length>800)db.audit.length=800; }
function statusBadge(s,map){ var c=map[s]||"b-grey"; return '<span class="badge '+c+'">'+esc(s)+'</span>'; }

/* ---------- roles ---------- */
var ROLES={admin:"Super Admin",md:"Managing Director",sales:"Sales",resv:"Reservations",ops:"Operations",acct:"Accounts"};
function canFinance(){ return session&&(session.role==="admin"||session.role==="md"||session.role==="acct"); }
function canSettings(){ return session&&(session.role==="admin"||session.role==="md"); }
function canProfit(){ return canFinance(); }

/* ---------- quotation math ---------- */
function qCalc(q){
  var pax=Math.max(1,n2(q.adults)+n2(q.children));
  var net=0; (q.lines||[]).forEach(function(l){ net+= n2(l.qty)*n2(l.unit)*(l.basis==="pp"?pax:1); });
  var mu=0;
  if(q.muMode==="pct") mu=net*n2(q.muVal)/100;
  else if(q.muMode==="pp") mu=n2(q.muVal)*pax;
  else mu=n2(q.muVal);
  var sub=net+mu;
  var tax=sub*n2(q.tax)/100, fee=sub*n2(q.fee)/100;
  var sell=sub+tax+fee;
  var gp=mu; var margin= sell>0 ? gp/sell*100 : 0;
  return {pax:pax,net:net,mu:mu,tax:tax,fee:fee,sell:sell,pp:sell/pax,gp:gp,margin:margin};
}

/* ---------- booking finance ---------- */
function bkReceived(b){ var t=0; db.receipts.forEach(function(r){ if(r.bookingId===b.id) t+=n2(r.amount); }); return t; }
function svcPaid(b,sid){ var t=0; db.payments.forEach(function(p){ if(p.bookingId===b.id&&p.serviceId===sid) t+=n2(p.amount); }); return t; }
function bkPayable(b){ var c=0,p=0; (b.services||[]).forEach(function(s){ c+=n2(s.cost); p+=svcPaid(b,s.id); }); return {cost:c,paid:p,due:c-p}; }
function activeBk(b){ return b.status!=="Cancelled"; }

function genBookingId(city){
  var code=(city||db.settings.defCity||"BKK").toUpperCase().replace(/[^A-Z]/g,"").slice(0,3)||"BKK";
  var yr=new Date().getFullYear();
  var key=code+"-"+yr;
  var n=(db.counters[key]||0)+1; db.counters[key]=n;
  return db.settings.prefix+"-"+code+"-"+yr+"-"+String(n).padStart(5,"0");
}

/* ---------- modal ---------- */
function openModal(title,body,buttons){
  document.getElementById("mtitle").textContent=title;
  document.getElementById("mbody").innerHTML=body;
  document.getElementById("mfoot").innerHTML=buttons||('<button class="btn grey" onclick="A.closeModal()">Cancel</button>');
  document.getElementById("mwrap").classList.add("open");
}
function gv(id){ var e=document.getElementById(id); return e?e.value.trim():""; }
function gn(id){ return n2(gv(id)); }
function inp(id,label,val,type,ph){ return '<label for="'+id+'">'+esc(label)+'</label><input id="'+id+'" type="'+(type||"text")+'" value="'+esc(val==null?"":val)+'" placeholder="'+esc(ph||"")+'">'; }
function sel(id,label,val,opts){ var h='<label for="'+id+'">'+esc(label)+'</label><select id="'+id+'">'; opts.forEach(function(o){ var v=Array.isArray(o)?o[0]:o, t=Array.isArray(o)?o[1]:o; h+='<option value="'+esc(v)+'"'+(String(v)===String(val)?" selected":"")+'>'+esc(t)+'</option>'; }); return h+'</select>'; }
function ta(id,label,val){ return '<label for="'+id+'">'+esc(label)+'</label><textarea id="'+id+'">'+esc(val||"")+'</textarea>'; }

/* ============================================================ ROUTER ============================================================ */
var NAV=[
  {grp:"OVERVIEW"},
  {h:"#/dash",t:"Dashboard",no:"12",ico:"📊"},
  {grp:"SALES"},
  {h:"#/crm",t:"Sales & CRM",no:"01",ico:"👥"},
  {h:"#/agents",t:"Agents & Clients",no:"01",ico:"🏢"},
  {h:"#/quotes",t:"Quotations",no:"02",ico:"🧮"},
  {grp:"PRODUCT"},
  {h:"#/suppliers",t:"Suppliers",no:"04",ico:"🚚"},
  {h:"#/contracts",t:"Hotel Contracts",no:"05",ico:"🏨"},
  {grp:"OPERATE"},
  {h:"#/bookings",t:"Bookings",no:"06",ico:"🧾"},
  {h:"#/ops",t:"Operations",no:"08",ico:"🗓️"},
  {grp:"CONTROL"},
  {h:"#/finance",t:"Finance",no:"11",ico:"💰",fin:true},
  {h:"#/settings",t:"Settings",no:"—",ico:"⚙️"}
];
function route(){ return location.hash||"#/dash"; }
window.addEventListener("hashchange",render);

function render(){
  var app=document.getElementById("app");
  if(!session){ app.innerHTML=loginView(); return; }
  var r=route(), page=r.split("/")[1]||"dash", arg=r.split("/")[2]||"";
  var navH='';
  NAV.forEach(function(n){
    if(n.grp){ navH+='<div class="grp">'+n.grp+'</div>'; return; }
    if(n.fin&&!canFinance())return;
    var on=r.indexOf(n.h)===0 || (n.h==="#/quotes"&&page==="quote") || (n.h==="#/bookings"&&page==="booking");
    navH+='<a class="'+(on?"on":"")+'" href="'+n.h+'"><span class="mno">'+n.no+'</span>'+esc(n.t)+'</a>';
  });
  var bn=[["#/dash","📊","Dash"],["#/crm","👥","CRM"],["#/quotes","🧮","Quotes"],["#/bookings","🧾","Bookings"],["#/ops","🗓️","Ops"],canFinance()?["#/finance","💰","Finance"]:["#/settings","⚙️","Settings"]];
  var bnavH=bn.map(function(x){ var on=r.indexOf(x[0])===0||(x[0]==="#/quotes"&&page==="quote")||(x[0]==="#/bookings"&&page==="booking"); return '<a class="'+(on?"on":"")+'" href="'+x[0]+'"><span class="ico">'+x[1]+'</span>'+x[2]+'</a>'; }).join("");
  var body="";
  if(page==="dash")body=dashView();
  else if(page==="crm")body=crmView();
  else if(page==="agents")body=agentsView();
  else if(page==="suppliers")body=suppliersView();
  else if(page==="contracts")body=contractsView();
  else if(page==="quotes")body=quotesView();
  else if(page==="quote")body=quoteEditView(arg);
  else if(page==="bookings")body=bookingsView();
  else if(page==="booking")body=bookingView(arg);
  else if(page==="ops")body=opsView();
  else if(page==="finance")body=canFinance()?financeView():'<div class="card">Finance is available to Managing Director, Accounts and Super Admin.</div>';
  else if(page==="settings")body=settingsView();
  else body=dashView();
  app.innerHTML=
    '<div id="topbar"><div class="brand">DISCOVERY ASIA<small>OPERATING SYSTEM</small></div><div class="sp"></div>'+
    '<div class="who">'+esc(session.name)+'<br>'+esc(ROLES[session.role])+'</div>'+
    '<button class="btn sm gold" onclick="A.logout()">Log out</button></div>'+
    '<div id="shell"><nav id="nav">'+navH+'</nav><main id="main">'+body+'</main></div>'+
    '<nav id="bnav">'+bnavH+'</nav>';
}

/* ============================================================ LOGIN ============================================================ */
function loginView(){
  var empty=db.agents.length===0&&db.suppliers.length===0&&db.quotes.length===0;
  return '<div id="login"><div class="box">'+
    '<div class="mark"><div class="t1">DISCOVERY ASIA</div><div class="t2">OPERATING SYSTEM</div></div>'+
    '<div class="mini" style="text-align:center;margin-bottom:10px">Phase 1 · Core Operating System</div>'+
    inp("li_name","Your name","","text","e.g. Bayazid")+
    sel("li_role","Team role","sales",Object.keys(ROLES).map(function(k){return [k,ROLES[k]];}))+
    inp("li_pw","Access password","","password","Role password")+
    '<div style="margin-top:14px"><button class="btn" style="width:100%" onclick="A.login()">Sign in</button></div>'+
    (empty?'<div style="margin-top:8px"><button class="btn ghost" style="width:100%" onclick="A.seedDemo(true)">Load demo data (Thailand DMC sample)</button></div>':'')+
    '<div class="mini" style="margin-top:12px;text-align:center">Data is stored on this device. Export a JSON backup weekly from Settings.</div>'+
  '</div></div>';
}

/* ============================================================ DASHBOARD (Module 12) ============================================================ */
function inRange(d,a,b){ return d&&d>=a&&d<=b; }
function dashView(){
  var t=todayISO();
  var mStart=t.slice(0,8)+"01";
  var d30=new Date(); d30.setDate(d30.getDate()+30);
  var e30=d30.getFullYear()+"-"+String(d30.getMonth()+1).padStart(2,"0")+"-"+String(d30.getDate()).padStart(2,"0");
  function bucket(list){ var bk=0,pax=0,sell=0,cost=0; list.forEach(function(b){ bk++; pax+=n2(b.adults)+n2(b.children); sell+=n2(b.sell); cost+=bkPayable(b).cost; }); return {bk:bk,pax:pax,sell:sell,cost:cost,gp:sell-cost}; }
  var act=db.bookings.filter(activeBk);
  var today=bucket(act.filter(function(b){return inRange(b.start,t,t)||(b.start<=t&&b.end>=t);}));
  var month=bucket(act.filter(function(b){return b.start&&b.start.slice(0,7)===t.slice(0,7);}));
  var next=bucket(act.filter(function(b){return b.start&&b.start>t&&b.start<=e30;}));
  var recv=0,pay=0;
  act.forEach(function(b){ recv+=n2(b.sell)-bkReceived(b); var p=bkPayable(b); pay+=p.due; });

  /* alerts */
  var alerts=[];
  db.inquiries.forEach(function(i){ if(i.status!=="Confirmed"&&i.status!=="Lost"&&i.follow&&i.follow<t) alerts.push(['a-warn','Follow-up overdue — '+i.client+' ('+i.status+'), due '+fdate(i.follow),'#/crm']); });
  db.contracts.forEach(function(c){ if(c.to&&c.to<t) alerts.push(['a-warn','Hotel contract expired — '+c.hotel+' ('+c.roomCat+'), valid to '+fdate(c.to),'#/contracts']); });
  act.forEach(function(b){
    ["deposit","final","rooming","release"].forEach(function(k){
      var d=b.deadlines&&b.deadlines[k]; if(!d)return;
      var lbl={deposit:"Deposit",final:"Final payment",rooming:"Rooming list",release:"Release / cancellation"}[k];
      if(d<t) alerts.push(['a-bad',b.ref+' — '+lbl+' deadline passed ('+fdate(d)+')','#/booking/'+b.id]);
      else if(daysDiff(t,d)<=7) alerts.push(['a-warn',b.ref+' — '+lbl+' due '+fdate(d),'#/booking/'+b.id]);
    });
    (b.services||[]).forEach(function(s){ if(s.date&&s.date>=t&&daysDiff(t,s.date)<=3&&s.status!=="Confirmed"&&s.status!=="Completed") alerts.push(['a-bad',b.ref+' — "'+s.desc+'" starts '+fdate(s.date)+' and is not confirmed','#/booking/'+b.id]); });
  });
  db.quotes.forEach(function(q){ if(q.status==="Draft"||q.status==="Sent"){ var c=qCalc(q); if(c.sell>0&&c.margin<n2(db.settings.minMargin)) alerts.push(['a-warn',q.ref+' — margin '+c.margin.toFixed(1)+'% is below the '+db.settings.minMargin+'% minimum','#/quote/'+q.id]); }});
  if(canFinance()){
    act.forEach(function(b){
      (b.services||[]).forEach(function(s){ if(s.due&&s.due<t&&svcPaid(b,s.id)<n2(s.cost)) alerts.push(['a-bad',b.ref+' — supplier payment overdue: '+s.desc+' ('+money(n2(s.cost)-svcPaid(b,s.id))+')','#/finance']); });
      if(b.start&&b.start>=t&&daysDiff(t,b.start)<=7&&bkReceived(b)<n2(b.sell)) alerts.push(['a-bad',b.ref+' arrives '+fdate(b.start)+' with '+money(n2(b.sell)-bkReceived(b))+' unpaid','#/finance']);
    });
  }

  function kpiRow(title,x,showFin){
    var h='<div class="card"><h2>'+title+'</h2><div class="kpis" style="margin-bottom:0">'+
      '<div class="kpi"><div class="v">'+x.bk+'</div><div class="l">Bookings</div></div>'+
      '<div class="kpi blue"><div class="v">'+x.pax+'</div><div class="l">Passengers</div></div>';
    if(showFin) h+='<div class="kpi gold"><div class="v">'+money0(x.sell)+'</div><div class="l">Sales</div></div>'+
      '<div class="kpi"><div class="v">'+money0(x.cost)+'</div><div class="l">Cost</div></div>'+
      '<div class="kpi '+(x.gp>=0?'':'bad')+'"><div class="v">'+money0(x.gp)+'</div><div class="l">Gross profit'+(x.sell>0?' · '+(x.gp/x.sell*100).toFixed(1)+'%':'')+'</div></div>';
    return h+'</div></div>';
  }
  var fin=canProfit();
  var h='<h1>Managing Director view</h1><div class="sub">'+fdate(t)+' · '+esc(db.settings.company)+'</div>';
  if(!fin)h='<h1>Dashboard</h1><div class="sub">'+fdate(t)+'</div>';
  h+=kpiRow("Today / in-house",today,fin)+kpiRow("This month (by arrival)",month,fin)+kpiRow("Upcoming 30 days",next,fin);
  if(fin) h+='<div class="kpis"><div class="kpi gold"><div class="v">'+money0(recv)+'</div><div class="l">Receivable</div></div><div class="kpi warn"><div class="v">'+money0(pay)+'</div><div class="l">Supplier payable</div></div><div class="kpi '+(recv-pay>=0?'':'bad')+'"><div class="v">'+money0(recv-pay)+'</div><div class="l">Net cash position</div></div></div>';
  h+='<div class="card"><h2>Critical alerts ('+alerts.length+')</h2>';
  if(!alerts.length)h+='<div class="alert a-ok">✔ No open alerts. Deadlines, margins and confirmations are all inside limits.</div>';
  alerts.slice(0,25).forEach(function(a){ h+='<div class="alert '+a[0]+'"><span>⚠</span><span style="flex:1">'+esc(a[1])+'</span><a href="'+a[2]+'" class="mini">Open →</a></div>'; });
  h+='</div>';
  return h;
}

var opsRange="week";
function opsView(){
  var t=todayISO();
  var end; if(opsRange==="today")end=t; else { var d=new Date(); d.setDate(d.getDate()+(opsRange==="week"?7:30)); end=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  var rows=[];
  db.bookings.filter(activeBk).forEach(function(b){
    (b.services||[]).forEach(function(s){ if(s.date&&s.date>=t&&s.date<=end) rows.push({b:b,s:s}); });
    if(b.start&&b.start>=t&&b.start<=end)rows.push({b:b,s:{id:"arr",desc:"ARRIVAL — "+b.client,cat:"Movement",date:b.start,status:b.status==="Confirmed"||b.status==="In Operation"?"Confirmed":"Pending"},sys:true});
    if(b.end&&b.end>=t&&b.end<=end)rows.push({b:b,s:{id:"dep",desc:"DEPARTURE — "+b.client,cat:"Movement",date:b.end,status:"Pending"},sys:true});
  });
  rows.sort(function(a,x){return (a.s.date||"").localeCompare(x.s.date||"");});
  var probs=rows.filter(function(r){return !r.sys&&(!r.s.supplierId||r.s.status==="Pending"||r.s.status==="Problem");});
  var h='<h1>Operations control center</h1><div class="sub">Daily command view of every movement and service.</div>';
  h+='<div class="chips">'+[["today","Today"],["week","Next 7 days"],["month","Next 30 days"]].map(function(x){return '<button class="chip '+(opsRange===x[0]?"on":"")+'" onclick="A.opsRange(\''+x[0]+'\')">'+x[1]+'</button>';}).join("")+'</div>';
  h+='<div class="kpis"><div class="kpi"><div class="v">'+rows.length+'</div><div class="l">Movements & services</div></div><div class="kpi bad"><div class="v">'+probs.length+'</div><div class="l">Need action</div></div></div>';
  if(!rows.length)h+='<div class="card">Nothing scheduled in this range.</div>';

    '<div class="row" style="margin-top:6px"><a class="btn sm ghost" href="#/booking/'+r.b.id+'">Open booking</a>'+(!r.sys?'<button class="btn sm" onclick="A.editSvc(\''+r.b.id+'\',\''+r.s.id+'\')">Update service</button>':'')+'</div></div>';
  });
  return h;
}

function financeView(){

  var recvT=0,payT=0,over=0;
  var h='<h1>Finance & payment tracking</h1><div class="sub">Agent receivables and supplier payables, always tied to a Booking ID.</div>';
  var r1='<div class="card"><h2>Receivables (clients & agents)</h2><div class="tw"><table><tr><th>Booking</th><th>Client</th><th class="num">Selling</th><th class="num">Received</th><th class="num">Balance</th><th></th></tr>';
  act.forEach(function(b){
    var rc=bkReceived(b), bal=n2(b.sell)-rc; recvT+=bal;
    if(bal<=0.005&&n2(b.sell)>0)return;
    r1+='<tr><td><a href="#/booking/'+b.id+'">'+esc(b.ref)+'</a><div class="mini">Arr '+fdate(b.start)+'</div></td><td>'+esc(b.client)+'</td><td class="num money">'+money(b.sell)+'</td><td class="num money">'+money(rc)+'</td><td class="num money"><b>'+money(bal)+'</b></td><td><button class="btn sm" onclick="A.addReceipt(\''+b.id+'\')">＋ Receipt</button></td></tr>';
  });
  r1+='</table></div></div>';
  var r2='<div class="card"><h2>Supplier payables</h2><div class="tw"><table><tr><th>Booking</th><th>Service</th><th>Supplier</th><th>Due</th><th class="num">Cost</th><th class="num">Paid</th><th class="num">Balance</th><th></th></tr>';
  act.forEach(function(b){
    (b.services||[]).forEach(function(s){
      var paid=svcPaid(b,s.id), bal=n2(s.cost)-paid; payT+=Math.max(0,bal);
      if(n2(s.cost)<=0)return;
      var od=s.due&&s.due<t&&bal>0.005; if(od)over++;
      if(bal<=0.005)return;
      var sup=byId(db.suppliers,s.supplierId);
      r2+='<tr'+(od?' style="background:var(--badBg)"':'')+'><td><a href="#/booking/'+b.id+'">'+esc(b.ref)+'</a></td><td>'+esc(s.desc)+'</td><td class="mini">'+(sup?esc(sup.name):'—')+'</td><td class="mini">'+(s.due?fdate(s.due):'—')+(od?' <span class="badge b-bad">Overdue</span>':'')+'</td><td class="num money">'+money(s.cost)+'</td><td class="num money">'+money(paid)+'</td><td class="num money"><b>'+money(bal)+'</b></td><td><button class="btn sm" onclick="A.addPayment(\''+b.id+'\',\''+s.id+'\')">＋ Pay</button></td></tr>';
    });
  });
  r2+='</table></div></div>';
  h+='<div class="kpis"><div class="kpi gold"><div class="v">'+money0(recvT)+'</div><div class="l">Receivable</div></div><div class="kpi warn"><div class="v">'+money0(payT)+'</div><div class="l">Payable</div></div><div class="kpi '+(over?'bad':'')+'"><div class="v">'+over+'</div><div class="l">Overdue supplier payments</div></div></div>';
  h+=r1+r2;
  /* profitability table */
  h+='<div class="card"><h2>Profit by booking</h2><div class="tw"><table><tr><th>Booking</th><th class="num">Selling</th><th class="num">Cost</th><th class="num">Gross profit</th><th class="num">GP%</th></tr>';
  act.forEach(function(b){ var pc=bkPayable(b).cost, gp=n2(b.sell)-pc; h+='<tr><td>'+esc(b.ref)+' <span class="mini">'+esc(b.client)+'</span></td><td class="num money">'+money(b.sell)+'</td><td class="num money">'+money(pc)+'</td><td class="num money">'+money(gp)+'</td><td class="num">'+(n2(b.sell)>0?(gp/n2(b.sell)*100).toFixed(1)+'%':'—')+'</td></tr>'; });
  h+='</table></div></div>';
  return h;
}

  h+='<table><tr><td><b>Invoice for</b></td><td>'+esc(b.client)+(byId(db.agents,b.agentId)?' — '+esc(byId(db.agents,b.agentId).name):'')+'</td><td><b>Booking ID</b></td><td>'+esc(b.ref)+'</td></tr>'+
  '<tr><td><b>Travel dates</b></td><td>'+fdate(b.start)+' – '+fdate(b.end)+'</td><td><b>Invoice date</b></td><td>'+fdate(todayISO())+'</td></tr></table>';
  h+='<table style="margin-top:12px"><tr><th>Description</th><th class="num">Amount</th></tr>'+
  '<tr><td>Tour package — '+esc(b.dest||"Thailand")+' · '+(n2(b.adults)+n2(b.children))+' guests</td><td class="num">'+money(b.sell)+'</td></tr>'+
  '<tr><td><b>Received to date</b></td><td class="num">'+money(recvd)+'</td></tr>'+
  '<tr><td><b>Balance due</b></td><td class="num"><b>'+money(n2(b.sell)-recvd)+'</b></td></tr></table>';
  var dl=b.deadlines||{};
  if(dl.final)h+='<div style="margin-top:10px;font-size:12.5px">Final payment due: <b>'+fdate(dl.final)+'</b></div>';
  return h;
}

      inp("f_conf","Supplier confirmation number",s.conf)+
      sel("f_status","Service status",s.status||"Pending",Object.keys(SSTAT))+
      (canFinance()?inp("f_cost","Supplier cost ("+db.settings.cur+")",s.cost,"number"):"")+
      (canFinance()?inp("f_due","Supplier payment due",s.due,"date"):"")+'</div>',
      '<button class="btn grey" onclick="A.closeModal()">Cancel</button>'+(sid?'<button class="btn red" onclick="A.delSvc(\''+bid+'\',\''+sid+'\')">Remove</button>':'')+'<button class="btn" onclick="A.saveSvc(\''+bid+'\',\''+sid+'\')">Save</button>');
  },
  saveSvc:function(bid,sid){
    var b=byId(db.bookings,bid); if(!b)return;
    var s=byId(b.services||[],sid);
    if(!s){ s={id:uid()}; b.services=b.services||[]; b.services.push(s); }
    s.cat=gv("f_cat"); s.desc=gv("f_desc")||s.cat; s.date=gv("f_date"); s.supplierId=gv("f_sup");
    s.conf=gv("f_conf"); s.status=gv("f_status");
    if(canFinance()){ s.cost=gn("f_cost"); s.due=gv("f_due"); }
    b.audit.unshift({at:new Date().toISOString(),by:session.name,action:"Service saved: "+s.desc+" ("+s.status+")"});
    pushAudit("Saved service on "+b.ref,s.desc); save(); A.closeModal(); render();
  },
  delSvc:function(bid,sid){
    var b=byId(db.bookings,bid); if(!b)return;
    if(!confirm("Remove this service from the booking?"))return;
    b.services=(b.services||[]).filter(function(s){return s.id!==sid;});
    b.audit.unshift({at:new Date().toISOString(),by:session.name,action:"Service removed"});
    pushAudit("Removed service on "+b.ref); save(); A.closeModal(); render();
  },
  printVoucher:function(id){ var b=byId(db.bookings,id); if(b)openDoc(voucherHTML(b),b.ref+" voucher"); },
  printInvoice:function(id){ var b=byId(db.bookings,id); if(b)openDoc(invoiceHTML(b),b.ref+" invoice"); },

  /* ---- finance ---- */
  addReceipt:function(bid){
    var b=byId(db.bookings,bid); if(!b)return;
    var bal=n2(b.sell)-bkReceived(b);
    openModal("Record client receipt — "+b.ref,
      '<div class="grid2">'+inp("f_amt","Amount received ("+db.settings.cur+")",bal>0?bal.toFixed(2):"","number")+
      inp("f_date","Date",todayISO(),"date")+
      sel("f_method","Method",'Bank transfer',["Bank transfer","Cash","Card","Wallet / other"])+
      inp("f_note","Reference / note","")+'</div><div class="mini">Balance before this receipt: '+money(bal)+'</div>',
      '<button class="btn grey" onclick="A.closeModal()">Cancel</button><button class="btn" onclick="A.saveReceipt(\''+bid+'\')">Save receipt</button>');
  },
  saveReceipt:function(bid){
    var b=byId(db.bookings,bid); if(!b)return;
    var amt=gn("f_amt"); if(amt<=0){ alert("Enter an amount."); return; }
    db.receipts.unshift({id:uid(),bookingId:bid,amount:amt,date:gv("f_date")||todayISO(),method:gv("f_method"),note:gv("f_note")});
    b.audit.unshift({at:new Date().toISOString(),by:session.name,action:"Client receipt "+money(amt)});
    pushAudit("Client receipt "+money(amt),b.ref); save(); A.closeModal(); render();
  },
  addPayment:function(bid,sid){
    var b=byId(db.bookings,bid); if(!b)return; var s=byId(b.services||[],sid); if(!s)return;
    var bal=n2(s.cost)-svcPaid(b,sid);
    openModal("Pay supplier — "+esc(s.desc),
      '<div class="grid2">'+inp("f_amt","Amount paid ("+db.settings.cur+")",bal>0?bal.toFixed(2):"","number")+
      inp("f_date","Date",todayISO(),"date")+inp("f_note","Reference / slip number","")+'</div>'+
      '<div class="mini">Booking '+esc(b.ref)+' · Balance before: '+money(bal)+'</div>',
      '<button class="btn grey" onclick="A.closeModal()">Cancel</button><button class="btn" onclick="A.savePayment(\''+bid+'\',\''+sid+'\')">Save payment</button>');
  },
  savePayment:function(bid,sid){
    var b=byId(db.bookings,bid); if(!b)return;
    var amt=gn("f_amt"); if(amt<=0){ alert("Enter an amount."); return; }
    db.payments.unshift({id:uid(),bookingId:bid,serviceId:sid,amount:amt,date:gv("f_date")||todayISO(),note:gv("f_note")});
    b.audit.unshift({at:new Date().toISOString(),by:session.name,action:"Supplier payment "+money(amt)});
    pushAudit("Supplier payment "+money(amt),b.ref); save(); A.closeModal(); render();
  },

  /* ---- settings / data ---- */
  saveSettings:function(){
    var s=db.settings;
    s.company=gv("s_company")||s.company; s.addr=gv("s_addr"); s.phone=gv("s_phone"); s.whatsapp=gv("s_wa");
    s.email=gv("s_email"); s.web=gv("s_web"); s.cur=gv("s_cur")||"USD"; s.minMargin=gn("s_min");
    s.tax=gn("s_tax"); s.payFee=gn("s_fee"); s.prefix=gv("s_prefix")||"DA"; s.defCity=gv("s_city")||"BKK";
    pushAudit("Settings updated"); save(); render(); alert("Settings saved.");
  },
  exportBackup:function(){
    var blob=new Blob([JSON.stringify({app:"discovery-asia-os",format:1,exportedAt:new Date().toISOString(),by:session?session.name:"",data:db},null,1)],{type:"application/json"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="DISCOVERY-ASIA-OS-BACKUP-"+todayISO()+".json"; a.click();
    pushAudit("Exported backup"); save();
  },
  importBackup:function(ev){
    var f=ev.target.files[0]; if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var j=JSON.parse(rd.result);
        var d=j&&j.app==="discovery-asia-os"?j.data:j;
        if(!d||!d.settings)throw new Error("bad");
        if(!confirm("Replace ALL data on this device with the backup file? Export a backup of the current data first if unsure."))return;
        db=d; if(!db.counters)db.counters={}; if(!db.seq)db.seq=0;
        pushAudit("Imported backup file"); save(); render(); alert("Backup imported.");
      }catch(e){ alert("This file is not a valid Discovery Asia OS backup."); }
    };
    rd.readAsText(f);
  },
  wipe:function(){
    if(!confirm("Erase ALL Discovery Asia OS data on this device? This cannot be undone."))return;
    if(!confirm("Final confirmation — erase everything?"))return;
    db=blankDB(); save(); render();
  },
  seedDemo:function(fromLogin){
    if(db.bookings.length&&!confirm("Demo data will be ADDED alongside existing records. Continue?"))return;
    var agA={id:uid(),name:"Skyway Holidays (Dhaka)",type:"B2B Agent",country:"Bangladesh",person:"Mr. Rahman",phone:"+880 17 0000 0000",email:"ops@skyway.example",terms:"Net rates · 50% deposit"};
    db.agents.unshift(agA);
    var supH={id:uid(),name:"Grand Riverside Hotel Bangkok",cat:"Hotel",dest:"Bangkok",phone:"+66 2 000 0000",terms:"7 days before service",rating:4,pref:true,status:"Active"};
    var supT={id:uid(),name:"Siam Fleet Transport",cat:"Transport",dest:"Bangkok / Pattaya",phone:"+66 8 000 0000",terms:"Pay on arrival",rating:4,status:"Active"};
    var supX={id:uid(),name:"Coral Island Marine Tours",cat:"Tour / Attraction",dest:"Pattaya",phone:"+66 8 111 1111",terms:"Prepayment",rating:5,pref:true,status:"Active"};
    db.suppliers.unshift(supH,supT,supX);
    var yr=new Date().getFullYear();
    var con={id:uid(),hotel:"Grand Riverside Hotel Bangkok",dest:"Bangkok",star:"4-star",roomCat:"Deluxe",meal:"ABF (breakfast)",rtype:"Group",from:yr+"-01-01",to:yr+"-10-31",dbl:62,sgl:55,trp:80,exb:22,policy:"Child under 12 with parents FOC without bed. 1 FOC per 20 paying pax. Cancellation 14 days."};
    db.contracts.unshift(con);
    var d1=new Date(); d1.setDate(d1.getDate()+21);
    var s1=d1.toISOString().slice(0,10);
    var d2=new Date(); d2.setDate(d2.getDate()+25);
    var e1=d2.toISOString().slice(0,10);
    var inq={id:uid(),created:new Date().toISOString(),client:"Meridian Pharma incentive group",agentId:agA.id,market:"Bangladesh",source:"B2B agent",dest:"Bangkok + Pattaya",owner:"Sales team",start:s1,end:e1,adults:24,children:0,hcat:"4-star",status:"Working",follow:todayISO(),req:"4N/5D incentive. Gala dinner on last night. Halal meals.",notesLog:[fdate(todayISO())+" (System): Demo inquiry created."]};
    db.inquiries.unshift(inq);
    var q=A._newQ();
    q.client=inq.client; q.agentId=agA.id; q.market="Bangladesh"; q.dest="Bangkok + Pattaya"; q.start=s1; q.end=e1; q.adults=24; q.children=0; q.inquiryId=inq.id; q.status="Sent"; q.muMode="pct"; q.muVal=18;
    q.lines=[
      {id:uid(),cat:"Hotel",desc:"Grand Riverside Deluxe — 12 TWN × 4 nights",date:s1,supplierId:supH.id,contractId:con.id,qty:48,unit:62,basis:"total"},
      {id:uid(),cat:"Transport",desc:"45-seat coach — airport transfers + Pattaya day trips",date:s1,supplierId:supT.id,qty:5,unit:180,basis:"total"},
      {id:uid(),cat:"Tour",desc:"Coral Island speedboat with lunch",date:s1,supplierId:supX.id,qty:1,unit:28,basis:"pp"},
      {id:uid(),cat:"Meal",desc:"Gala dinner with hall & sound",qty:1,unit:22,basis:"pp"},
      {id:uid(),cat:"Guide",desc:"Bengali-speaking guide × 5 days",qty:5,unit:60,basis:"total"}
    ];
    q.days=[
      {title:"Arrival Bangkok",desc:"Meet & greet at Suvarnabhumi, transfer to hotel, evening free at Asiatique riverfront.",meals:"—",city:"Bangkok"},
      {title:"Bangkok city & temples",desc:"Grand Palace area, Wat Arun photo stop, Chao Phraya boat ride.",meals:"Breakfast, Lunch",city:"Bangkok"},
      {title:"Pattaya — Coral Island",desc:"Speedboat to Koh Larn, beach time and water sports (optional), seafood lunch.",meals:"Breakfast, Lunch",city:"Bangkok"},
      {title:"Free day + gala dinner",desc:"Shopping at ICONSIAM, evening gala dinner with awards ceremony.",meals:"Breakfast, Gala dinner",city:"Bangkok"},
      {title:"Departure",desc:"Check-out and transfer to airport.",meals:"Breakfast",city:"—"}
    ];
    db.quotes.unshift(q);
    pushAudit("Demo data loaded");
    save();
    if(fromLogin)alert("Demo data loaded. Sign in with a role password to explore — e.g. Managing Director / DA-MD-2026.");
    render();
  }
};
window.A=A;

/* ---------- boot ---------- */
(function boot(){
  db=load();
  try{ var s=JSON.parse(sessionStorage.getItem(SESKEY)); if(s&&s.role&&ROLES[s.role])session=s; }catch(e){}
  render();
})();
</script>
</body>
